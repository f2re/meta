name: Ошибка
description: Сообщить о воспроизводимой ошибке Project Control / F2RE Meta
title: "[bug] "
labels: [bug]
body:
  - type: dropdown
    id: astra
    attributes:
      label: Astra Linux
      options:
        - "1.7"
        - "1.8"
        - "Debian / другое"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Project Control
      placeholder: "0.5.0"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Способ установки
      options:
        - GitHub Release meta-bundle
        - F2RE Stack
        - GitHub Actions artifact
        - Из исходников
        - Другое
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Шаги воспроизведения
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика
      description: Не прикладывайте access token, пароли и другие секреты.
      render: shell
  - type: checkboxes
    id: secrets
    attributes:
      label: Безопасность
      options:
        - label: Я удалил из логов ключи доступа, пароли и другие секреты.
          required: true
