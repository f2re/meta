name: Probe MW-Nowcast recovery sources

on:
  push:
    branches:
      - recovery-mw-nowcast-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe caches and archive APIs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p probe
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          targets = {}
          def add(name, url, headers=None):
              targets[name] = (url, headers or {})

          repo = "https://github.com/microsoft/MW-Nowcast"
          sha = "871c21ef3a0612b4e3fa476367a4d1aea50c5004"
          asset_id = "571727871"

          add("repos_ecosystems",
              "https://repos.ecosyste.ms/api/v1/hosts/GitHub/repositories/microsoft%2FMW-Nowcast")
          add("commits_ecosystems",
              "https://commits.ecosyste.ms/api/v1/hosts/GitHub/repositories/microsoft%2FMW-Nowcast")
          add("timeline_encoded",
              "https://timeline.ecosyste.ms/api/v1/events/microsoft%2FMW-Nowcast?per_page=100")
          add("timeline_path",
              "https://timeline.ecosyste.ms/api/v1/events/microsoft/MW-Nowcast?per_page=100")

          archives = {
              "archive_api_tag": "https://api.github.com/repos/microsoft/MW-Nowcast/zipball/v1.0.0",
              "archive_codeload_tag": "https://codeload.github.com/microsoft/MW-Nowcast/zip/refs/tags/v1.0.0",
              "archive_github_tag": "https://github.com/microsoft/MW-Nowcast/archive/refs/tags/v1.0.0.zip",
              "archive_codeload_sha": f"https://codeload.github.com/microsoft/MW-Nowcast/zip/{sha}",
              "archive_api_sha": f"https://api.github.com/repos/microsoft/MW-Nowcast/zipball/{sha}",
          }
          for name, archive_url in archives.items():
              q = urllib.parse.urlencode({"url": archive_url})
              add(name + "_list", "https://archives.ecosyste.ms/api/v1/archives/list?" + q)
              add(name + "_readme", "https://archives.ecosyste.ms/api/v1/archives/readme?" + q)

          add("swh_revision",
              f"https://archive.softwareheritage.org/api/1/revision/{sha}/")
          quoted_origin = urllib.parse.quote(repo, safe="")
          add("swh_origin",
              f"https://archive.softwareheritage.org/api/1/origin/{quoted_origin}/get/")

          add("github_raw_readme_sha",
              f"https://raw.githubusercontent.com/microsoft/MW-Nowcast/{sha}/README.md")
          add("github_codeload_sha",
              f"https://codeload.github.com/microsoft/MW-Nowcast/zip/{sha}")
          add("github_release_asset_api",
              f"https://api.github.com/repos/microsoft/MW-Nowcast/releases/assets/{asset_id}",
              {"Accept":"application/octet-stream"})
          add("github_release_asset_metadata",
              f"https://api.github.com/repos/microsoft/MW-Nowcast/releases/assets/{asset_id}",
              {"Accept":"application/vnd.github+json"})
          add("github_release_file",
              "https://github.com/microsoft/MW-Nowcast/releases/download/v1.0.0/mw_nowcast_us_9to36_128.pth",
              {"Range":"bytes=0-1023"})

          results = {}
          for name, (url, headers) in targets.items():
              hdr = {
                  "User-Agent": "mw-nowcast-recovery/1.0",
                  **headers,
              }
              req = urllib.request.Request(url, headers=hdr)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read(2_000_000)
                      entry = {
                          "ok": True,
                          "status": getattr(r, "status", None),
                          "final_url": r.geturl(),
                          "headers": dict(r.headers.items()),
                          "bytes_read": len(body),
                      }
              except urllib.error.HTTPError as e:
                  body = e.read(2_000_000)
                  entry = {
                      "ok": False,
                      "status": e.code,
                      "final_url": e.geturl(),
                      "headers": dict(e.headers.items()) if e.headers else {},
                      "error": repr(e),
                      "bytes_read": len(body),
                  }
              except Exception as e:
                  body = b""
                  entry = {
                      "ok": False,
                      "status": None,
                      "final_url": url,
                      "headers": {},
                      "error": repr(e),
                      "bytes_read": 0,
                  }

              body_path = os.path.join("probe", name + ".body")
              with open(body_path, "wb") as f:
                  f.write(body)
              entry["body_path"] = body_path
              try:
                  entry["body_preview"] = body[:12000].decode("utf-8", "replace")
              except Exception:
                  entry["body_preview"] = repr(body[:1024])
              results[name] = entry
              print("\n===", name, "===")
              print(json.dumps(entry, ensure_ascii=False, indent=2))

          with open("probe/results.json", "w", encoding="utf-8") as f:
              json.dump(results, f, ensure_ascii=False, indent=2)
          PY

          {
            echo "=== gitclone.com ls-remote ==="
            git ls-remote https://gitclone.com/github.com/microsoft/MW-Nowcast.git 2>&1 || true
            echo
            echo "=== ghproxy tag HEAD ==="
            curl -IL --max-time 45 'https://ghproxy.net/https://github.com/microsoft/MW-Nowcast/archive/refs/tags/v1.0.0.zip' 2>&1 || true
          } | tee probe/mirrors.txt

      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: mw-nowcast-recovery-probes
          path: probe
          if-no-files-found: error
