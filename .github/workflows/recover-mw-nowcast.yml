name: Fast recover MW-Nowcast

on:
  push:
    branches:
      - recovery-mw-nowcast-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch author events and patch CDN
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p fast
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          target_id=1372608490
          target_name="microsoft/MW-Nowcast"
          tok=os.environ.get("GH_TOKEN","")
          hdr={"Accept":"application/vnd.github+json","User-Agent":"mw-nowcast-recovery/3.0"}
          if tok: hdr["Authorization"]="Bearer "+tok

          matched=[]
          for page in range(1,4):
              u=f"https://api.github.com/users/zuliangfang/events/public?per_page=100&page={page}"
              req=urllib.request.Request(u,headers=hdr)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      rows=json.load(r)
              except Exception as e:
                  print("EVENT ERR",page,repr(e)); break
              print("page",page,"rows",len(rows))
              for e in rows:
                  repo=e.get("repo") or {}
                  if repo.get("id")==target_id or repo.get("name")==target_name:
                      matched.append(e)
              if len(rows)<100: break
          print("=== MATCHED AUTHOR EVENTS ===")
          print(json.dumps(matched,ensure_ascii=False,indent=2))
          with open("fast/author_events.json","w",encoding="utf-8") as f:
              json.dump(matched,f,ensure_ascii=False,indent=2)

          urls={
            "patch_cdn":"https://patch-diff.githubusercontent.com/raw/microsoft/MW-Nowcast/pull/1.patch",
            "diff_cdn":"https://patch-diff.githubusercontent.com/raw/microsoft/MW-Nowcast/pull/1.diff",
            "pr_patch":"https://github.com/microsoft/MW-Nowcast/pull/1.patch",
            "pr_diff":"https://github.com/microsoft/MW-Nowcast/pull/1.diff",
          }
          out={}
          for name,u in urls.items():
              req=urllib.request.Request(u,headers={"User-Agent":"mw-nowcast-recovery/3.0"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read(5_000_000)
                      out[name]={"status":r.status,"url":r.geturl(),"body":b.decode("utf-8","replace")}
              except urllib.error.HTTPError as e:
                  b=e.read(1_000_000)
                  out[name]={"status":e.code,"url":e.geturl(),"body":b.decode("utf-8","replace")}
              except Exception as e:
                  out[name]={"error":repr(e)}
              print("===",name,"===")
              print(json.dumps({k:v for k,v in out[name].items() if k!="body"},ensure_ascii=False))
              if "body" in out[name]: print(out[name]["body"][:20000])
          with open("fast/patches.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mw-nowcast-fast-recovery
          path: fast
