name: Recover MW-Nowcast by repo ID

on:
  push:
    branches:
      - recovery-mw-nowcast-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scan GH Archive by immutable repo ID
        shell: bash
        run: |
          set -eu
          mkdir -p idscan
          python3 - <<'PY'
          import concurrent.futures, datetime as dt, gzip, json, urllib.request

          TARGET_ID=1372608490
          START=dt.datetime(2026,9,16,5)
          END=dt.datetime(2026,9,19,3)
          hours=[]
          x=START
          while x<=END:
              hours.append(x)
              x+=dt.timedelta(hours=1)

          # Search raw bytes for decimal repo id first to avoid JSON parsing all events.
          needles=[
              f'"repo":{{"id":{TARGET_ID},'.encode(),
              f'"repo": {{"id": {TARGET_ID},'.encode(),
              f'"id":{TARGET_ID},"name"'.encode(),
              f'"id": {TARGET_ID}, "name"'.encode(),
          ]

          def scan(t):
              url=f"https://data.gharchive.org/{t:%Y-%m-%d}-{t.hour}.json.gz"
              hits=[]
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"mw-nowcast-id-recovery/1.0"})
                  with urllib.request.urlopen(req,timeout=180) as resp, gzip.GzipFile(fileobj=resp) as gz:
                      for raw in gz:
                          if not any(n in raw for n in needles):
                              continue
                          try:e=json.loads(raw)
                          except:continue
                          if (e.get("repo") or {}).get("id")==TARGET_ID:
                              hits.append(e)
                  return t,hits,None
              except Exception as e:
                  return t,[],repr(e)

          events=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              futs=[ex.submit(scan,h) for h in hours]
              for f in concurrent.futures.as_completed(futs):
                  t,hits,err=f.result()
                  if hits or err:
                      print(t.isoformat(), "events",len(hits),"err",err)
                  events.extend(hits)

          events.sort(key=lambda e:e.get("created_at",""))
          with open("idscan/events.json","w",encoding="utf-8") as f:
              json.dump(events,f,ensure_ascii=False,indent=2)

          compact=[]
          for e in events:
              p=e.get("payload") or {}
              r={"id":e.get("id"),"type":e.get("type"),"created_at":e.get("created_at"),
                 "actor":(e.get("actor") or {}).get("login"),"repo":e.get("repo")}
              if e.get("type")=="PushEvent":
                  r["push"]={k:p.get(k) for k in ["push_id","size","distinct_size","ref","head","before"]}
                  r["commits"]=p.get("commits")
              elif e.get("type")=="CreateEvent":
                  r["create"]={k:p.get(k) for k in ["ref","ref_type","master_branch","description","pusher_type"]}
              elif e.get("type")=="PullRequestEvent":
                  pr=p.get("pull_request") or {}
                  r["action"]=p.get("action")
                  r["number"]=p.get("number")
                  r["pr"]={
                    "id":pr.get("id"),"merged":pr.get("merged"),"merge_commit_sha":pr.get("merge_commit_sha"),
                    "head":pr.get("head"),"base":pr.get("base"),
                    "title":pr.get("title"),"body":pr.get("body"),
                  }
              elif e.get("type")=="ReleaseEvent":
                  r["release"]=p.get("release")
              else:
                  r["payload"]=p
              compact.append(r)
          with open("idscan/compact.json","w",encoding="utf-8") as f:
              json.dump(compact,f,ensure_ascii=False,indent=2)

          print("=== EVENTS FOR REPO ID",TARGET_ID,"===")
          print(json.dumps(compact,ensure_ascii=False,indent=2))
          print("TOTAL",len(events))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mw-nowcast-idscan
          path: idscan
