name: Release Contract

on:
  pull_request:
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-contract.yml"
      - ".github/workflows/release-verify.yml"
      - "project-control/VERSION"
      - "project-control/scripts/assemble-github-release.py"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-contract.yml"
      - ".github/workflows/release-verify.yml"
      - "project-control/VERSION"
      - "project-control/scripts/assemble-github-release.py"

permissions:
  contents: read

jobs:
  latest:
    name: Published release metadata and download contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          CANDIDATE="v$(tr -d '[:space:]' < project-control/VERSION)"
          if gh release view "$CANDIDATE" >/dev/null 2>&1; then
            TAG="$CANDIDATE"
          else
            TAG="$(gh release view --json tagName --jq .tagName)"
            echo "Candidate $CANDIDATE is not published yet; auditing latest stable $TAG."
          fi
          echo "$TAG" > published-tag.txt
          printf '%s\n' "${TAG#v}" > published-version.txt

      - name: Inspect published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TAG="$(cat published-tag.txt)"
          VERSION="$(cat published-version.txt)"
          gh release view "$TAG" --json tagName,name,isDraft,isPrerelease,assets > release.json
          python3 - "$VERSION" release.json <<'PY'
          import json,sys
          version=sys.argv[1]; data=json.load(open(sys.argv[2],encoding='utf-8'))
          assert data['tagName']==f'v{version}' and data['isDraft'] is False and data['isPrerelease'] is False
          names={x['name'] for x in data['assets']}
          core={'SHA256SUMS','release-manifest.json','install-project-control.sh',
            f'f2re-meta-{version}-astra-1.7-amd64.tar.gz',f'f2re-meta-{version}-astra-1.8-amd64.tar.gz',
            'f2re-meta-astra-1.7-amd64.tar.gz','f2re-meta-astra-1.8-amd64.tar.gz',
            f'project-control-{version}-linux-x64.tar.gz','project-control-linux-x64.tar.gz'}
          missing=core-names
          print('published tag:',data['tagName'],'assets:',len(names),'missing core:',sorted(missing))
          assert not missing,sorted(missing)
          PY

      - name: Download and validate integrity metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TAG="$(cat published-tag.txt)"
          VERSION="$(cat published-version.txt)"
          mkdir verify
          gh release download "$TAG" --dir verify --pattern 'release-manifest.json' --pattern 'SHA256SUMS' --pattern '*.sha256'
          python3 - "$VERSION" release.json verify/release-manifest.json <<'PY'
          import json,sys
          version=sys.argv[1]
          release=json.load(open(sys.argv[2],encoding='utf-8'))
          manifest=json.load(open(sys.argv[3],encoding='utf-8'))
          assert manifest['schema'] in {'f2re-github-release/v1','f2re-github-release/v2'}
          assert manifest['version']==version and manifest['tag']==f'v{version}'
          assert {(x['version'],x['arch']) for x in manifest['targets']}=={('1.7','amd64'),('1.8','amd64')}
          names={x['name'] for x in release['assets']}
          if manifest['schema']=='f2re-github-release/v2':
            required={
              f'f2re-stack-{version}-astra-1.7-amd64.tar.gz',f'f2re-stack-{version}-astra-1.8-amd64.tar.gz',
              'f2re-stack-astra-1.7-amd64.tar.gz','f2re-stack-astra-1.8-amd64.tar.gz',
              'docomator-project-control.f2re.zip','planer-solving-project-control.f2re.zip','kafedra-planner-project-control.f2re.zip'}
            assert required <= names,sorted(required-names)
            assert len(manifest.get('managedProjects',[]))==3
          print('published-release-contract-ok:',manifest['schema'],manifest['tag'],'assets=',len(names))
          PY
