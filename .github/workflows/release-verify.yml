name: Release Verify

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    name: Published assets, SHA-256 and full-stack manifest
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve release source
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == workflow_run ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "upstream=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "upstream=success" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - name: Require successful Release workflow
        if: steps.source.outputs.upstream != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          UPSTREAM: ${{ steps.source.outputs.upstream }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=failure -f context='release/assets' \
            -f description="Release workflow: $UPSTREAM" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
          exit 1

      - name: Fetch release metadata and integrity files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < project-control/VERSION)"
          TAG="v$VERSION"
          echo "$VERSION" > version.txt
          gh release view "$TAG" --json tagName,name,isDraft,isPrerelease,assets > release.json
          mkdir verify
          gh release download "$TAG" --dir verify \
            --pattern 'release-manifest.json' \
            --pattern 'SHA256SUMS' \
            --pattern '*.sha256'

      - name: Verify complete v2 asset contract from GitHub digests
        run: |
          set -Eeuo pipefail
          VERSION="$(cat version.txt)"
          python3 - "$VERSION" release.json verify <<'PY'
          import json,re,sys
          from pathlib import Path
          version=sys.argv[1]; root=Path(sys.argv[3])
          release=json.load(open(sys.argv[2],encoding='utf-8'))
          assert release['tagName']==f'v{version}'
          assert release['isDraft'] is False and release['isPrerelease'] is False
          assets={x['name']:x for x in release['assets']}
          assert len(assets)==39, len(assets)

          def digest(name):
              value=(assets[name].get('digest') or '')
              assert value.startswith('sha256:'),(name,value)
              value=value.split(':',1)[1]
              assert re.fullmatch(r'[0-9a-f]{64}',value),(name,value)
              return value

          manifest=json.loads((root/'release-manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema']=='f2re-github-release/v2'
          assert manifest['version']==version and manifest['tag']==f'v{version}'
          assert re.fullmatch(r'[0-9a-f]{40}',manifest['sourceCommit'])
          assert {(x['version'],x['arch']) for x in manifest['targets']}=={('1.7','amd64'),('1.8','amd64')}
          assert len(manifest['managedProjects'])==3
          assert {x['projectId'] for x in manifest['managedProjects']}=={'docomator','planer-solving','kafedra-planner'}

          manifest_assets={x['name']:x for x in manifest['assets']}
          assert len(manifest_assets)==19, len(manifest_assets)
          for name,item in manifest_assets.items():
              assert name in assets,name
              assert item['sha256']==digest(name),(name,item['sha256'],digest(name))
              assert item['bytes']==assets[name]['size'],(name,item['bytes'],assets[name]['size'])

          required={
              f'f2re-stack-{version}-astra-1.7-amd64.tar.gz',
              f'f2re-stack-{version}-astra-1.8-amd64.tar.gz',
              'f2re-stack-astra-1.7-amd64.tar.gz','f2re-stack-astra-1.8-amd64.tar.gz',
              'docomator-project-control.f2re.zip','planer-solving-project-control.f2re.zip','kafedra-planner-project-control.f2re.zip',
              'f2re-meta-astra-1.7-amd64.tar.gz','f2re-meta-astra-1.8-amd64.tar.gz',
              'project-control-linux-x64.tar.gz','f2re-meta-all-astra-amd64.zip'}
          assert required <= assets.keys(), sorted(required-assets.keys())

          for target in manifest['targets']:
              astra=target['version']
              versioned=target['fullStack']; alias=f'f2re-stack-astra-{astra}-amd64.tar.gz'
              assert digest(versioned)==digest(alias),(versioned,alias)
              versioned=target['metaBundle']; alias=f'f2re-meta-astra-{astra}-amd64.tar.gz'
              assert digest(versioned)==digest(alias),(versioned,alias)
          assert digest(f'project-control-{version}-linux-x64.tar.gz')==digest('project-control-linux-x64.tar.gz')

          sums={}
          for raw in (root/'SHA256SUMS').read_text(encoding='utf-8').splitlines():
              if raw.strip():
                  h,n=raw.split(None,1); sums[Path(n.strip().lstrip('*')).name]=h
          assert set(sums)==set(assets)-{'SHA256SUMS'},(len(sums),len(assets))
          for name,h in sums.items(): assert h==digest(name),(name,h,digest(name))

          sidecars=list(root.glob('*.sha256'))
          for path in sidecars:
              parts=path.read_text(encoding='utf-8').strip().split(); assert len(parts)>=2,path.name
              declared,target=parts[0],Path(parts[-1].lstrip('*')).name
              assert target in assets,(path.name,target)
              assert declared==digest(target),(path.name,target,declared,digest(target))

          print('release-v2-ok:',version,'assets=',len(assets),'manifest=',len(manifest_assets),'sums=',len(sums),'sidecars=',len(sidecars))
          (root/'source-commit.txt').write_text(manifest['sourceCommit']+'\n',encoding='utf-8')
          PY

      - name: Publish canonical release/assets success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_COMMIT="$(tr -d '[:space:]' < verify/source-commit.txt)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_COMMIT" \
            -f state=success -f context='release/assets' \
            -f description='39 assets: controller, apps and Astra 1.7/1.8 stacks verified' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest"
