name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project-control/VERSION"
      - "project-control/config/managed-projects.json"
      - "project-control/scripts/assemble-github-release.py"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release contract
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        working-directory: project-control
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve SemVer
        id: version
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "VERSION is not SemVer: $VERSION" >&2; exit 2; }
          test "$VERSION" = "$(node -p 'require("./package.json").version')"
          test "$VERSION" = "$(awk -F= '$1=="PROJECT_CONTROL_VERSION"{print $2}' config/project-control.env.example)"
          grep -qE "^## \[$VERSION\]" ../CHANGELOG.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release tests
        run: npm run check

      - name: Shell and Python syntax
        run: |
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find deploy scripts -type f -name '*.sh' -print0)
          python3 -m py_compile \
            src/package_tool.py scripts/package-release.py scripts/stack_tool.py \
            scripts/apply-package.py scripts/assemble-github-release.py

  controller:
    name: Build portable controller
    needs: validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: project-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - name: Prepare portable Node.js runtime
        id: runtime
        run: |
          set -Eeuo pipefail
          NODE_BIN="$(readlink -f "$(command -v node)")"
          NODE_HOME="$(cd "$(dirname "$NODE_BIN")/.." && pwd -P)"
          test -x "$NODE_HOME/bin/npm"
          test -f "$NODE_HOME/LICENSE"
          echo "path=$NODE_HOME" >> "$GITHUB_OUTPUT"

      - name: Build controller bundle
        env:
          NODE_RUNTIME_DIR: ${{ steps.runtime.outputs.path }}
        run: |
          set -Eeuo pipefail
          OUT_DIR="$RUNNER_TEMP/controller" ./scripts/build-offline-bundle.sh
          cd "$RUNNER_TEMP/controller"
          sha256sum -c --strict project-control-*.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-controller
          path: ${{ runner.temp }}/controller/*
          if-no-files-found: error
          retention-days: 7

  astra:
    name: Build Astra ${{ matrix.astra }} release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - astra: "1.7"
            image: registry.astralinux.ru/library/astra/ubi17:1.7.5
          - astra: "1.8"
            image: registry.astralinux.ru/library/astra/ubi18-python311:latest
    defaults:
      run:
        working-directory: project-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - name: Prepare portable Node.js runtime
        id: runtime
        run: |
          set -Eeuo pipefail
          NODE_BIN="$(readlink -f "$(command -v node)")"
          NODE_HOME="$(cd "$(dirname "$NODE_BIN")/.." && pwd -P)"
          test -x "$NODE_HOME/bin/npm"
          test -f "$NODE_HOME/LICENSE"
          echo "path=$NODE_HOME" >> "$GITHUB_OUTPUT"

      - name: Build meta-bundle
        env:
          NODE_RUNTIME_DIR: ${{ steps.runtime.outputs.path }}
          TARGET_ASTRA_VERSION: ${{ matrix.astra }}
        run: |
          set -Eeuo pipefail
          OUT_DIR="$RUNNER_TEMP/astra-${{ matrix.astra }}" ./scripts/build-meta-bundle.sh
          cd "$RUNNER_TEMP/astra-${{ matrix.astra }}"
          sha256sum -c --strict f2re-meta-*.tar.gz.sha256

      - name: Pull official Astra ${{ matrix.astra }} UBI
        run: docker pull '${{ matrix.image }}'

      - name: Deployment smoke on Astra ${{ matrix.astra }}
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/astra-${{ matrix.astra }}:/dist:ro" \
            -v "$GITHUB_WORKSPACE/project-control/scripts/ci-install-smoke.sh:/ci-install-smoke.sh:ro" \
            '${{ matrix.image }}' \
            /bin/bash -lc '
              set -Eeuo pipefail
              missing=0
              for cmd in python3 useradd groupadd getent runuser sha256sum tar; do command -v "$cmd" >/dev/null 2>&1 || missing=1; done
              if ((missing)); then
                apt-get update >/dev/null
                DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 passwd util-linux coreutils tar >/dev/null
              fi
              cd /dist
              sha256sum -c --strict f2re-meta-*.tar.gz.sha256
              mkdir -p /tmp/meta
              tar -xzf f2re-meta-*.tar.gz -C /tmp/meta
              META_ROOT="$(find /tmp/meta -mindepth 1 -maxdepth 1 -type d -print -quit)"
              /ci-install-smoke.sh "$META_ROOT" '${{ matrix.astra }}'
            '

      - uses: actions/upload-artifact@v4
        with:
          name: release-astra-${{ matrix.astra }}
          path: |
            ${{ runner.temp }}/astra-${{ matrix.astra }}/f2re-meta-*.tar.gz
            ${{ runner.temp }}/astra-${{ matrix.astra }}/f2re-meta-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  managed:
    name: Build managed project update bundles
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: project-control
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve build runtime
        id: runtime
        run: |
          set -Eeuo pipefail
          NODE_BIN="$(readlink -f "$(command -v node)")"
          NODE_HOME="$(cd "$(dirname "$NODE_BIN")/.." && pwd -P)"
          test -x "$NODE_HOME/bin/npm"
          test -f "$NODE_HOME/LICENSE"
          echo "path=$NODE_HOME" >> "$GITHUB_OUTPUT"

      - name: Build exact-SHA docomator, planer-solving and kafedra-planner packages
        env:
          NODE_RUNTIME_DIR: ${{ steps.runtime.outputs.path }}
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/managed-build"
          WORK="$RUNNER_TEMP/managed-work"
          ./scripts/f2re-stack.sh build --astra 1.8 --output "$OUT" --work-dir "$WORK"
          INPUT="$OUT/stack-inputs-1.8"
          python3 scripts/stack_tool.py verify-inputs "$INPUT" config/managed-projects.json \
            --meta-commit "$GITHUB_SHA" --astra-version 1.8 >/dev/null
          mkdir -p "$RUNNER_TEMP/managed-release"
          find "$INPUT" -maxdepth 1 -type f \( -name '*-project-control.f2re.zip' -o -name '*-project-control.f2re.zip.sha256' \) \
            -exec cp -t "$RUNNER_TEMP/managed-release" {} +
          test "$(find "$RUNNER_TEMP/managed-release" -type f -name '*-project-control.f2re.zip' | wc -l)" -eq 3
          test "$(find "$RUNNER_TEMP/managed-release" -type f -name '*-project-control.f2re.zip.sha256' | wc -l)" -eq 3
          ls -lh "$RUNNER_TEMP/managed-release"

      - uses: actions/upload-artifact@v4
        with:
          name: release-managed-projects
          path: ${{ runner.temp }}/managed-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Assemble, publish and verify complete GitHub Release
    needs: [validate, controller, astra, managed]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-input
          merge-multiple: true

      - name: Assemble meta, managed updates and full stacks
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -Eeuo pipefail
          python3 project-control/scripts/assemble-github-release.py \
            --input release-input \
            --output release-assets \
            --version "$VERSION" \
            --source-commit "$GITHUB_SHA" \
            --managed project-control/config/managed-projects.json
          ls -lh release-assets

      - name: Build release notes from CHANGELOG
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 - "$VERSION" CHANGELOG.md > RELEASE_NOTES.md <<'PY'
          import re,sys
          version=sys.argv[1]; text=open(sys.argv[2],encoding='utf-8').read()
          match=re.search(rf'^## \[{re.escape(version)}\].*?$',text,re.M)
          if not match: raise SystemExit(f'CHANGELOG section [{version}] not found')
          tail=text[match.start():]
          following=re.search(r'^## (?:\[|[0-9])',tail[match.end()-match.start():],re.M)
          body=tail if not following else tail[:match.end()-match.start()+following.start()]
          print(body.strip())
          print('\n### Проверенные deployment targets\n')
          print('- Astra Linux Special Edition 1.7, amd64')
          print('- Astra Linux Special Edition 1.8, amd64')
          print('\nRelease включает controller, оба meta-bundle, три Project Control update package и два готовых full-stack archive. Все assets фиксируются SHA-256.')
          PY

      - name: Publish immutable release once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; immutable release is left unchanged."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --latest \
              --title "F2RE Meta $TAG" --notes-file RELEASE_NOTES.md release-assets/*
          fi

      - name: Verify every uploaded asset with GitHub SHA-256 digest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -Eeuo pipefail
          gh release view "$TAG" --json assets > published.json
          python3 - published.json release-assets <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          published={x['name']:x for x in json.load(open(sys.argv[1],encoding='utf-8'))['assets']}
          root=Path(sys.argv[2])
          local={p.name:p for p in root.iterdir() if p.is_file()}
          assert set(published)==set(local),(sorted(set(local)-set(published)),sorted(set(published)-set(local)))
          for name,path in local.items():
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              expected='sha256:'+h.hexdigest()
              assert published[name].get('digest')==expected,(name,published[name].get('digest'),expected)
              assert published[name]['size']==path.stat().st_size,(name,published[name]['size'],path.stat().st_size)
          print('published-release-ok:',len(local),'assets')
          PY
